<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แนะนำตัว - My Profile</title>
    <!-- นำเข้าฟอนต์ภาษาไทย Prompt จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* ตั้งค่าพื้นฐาน */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            /* พื้นหลังไล่สี */
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        /* การ์ดโปรไฟล์ */
        .profile-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        /* แบนเนอร์ด้านบน */
        .header-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 120px;
        }

        /* ข้อมูลโปรไฟล์ */
        .profile-info {
            padding: 0 30px 40px;
            text-align: center;
            margin-top: -60px;
        }

        /* รูปโปรไฟล์ */
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            background-color: #eee;
        }

        h1 {
            margin-top: 15px;
            font-size: 24px;
            color: #1f2937;
            font-weight: 600;
        }

        .title {
            color: #6b7280;
            font-size: 16px;
            margin-bottom: 20px;
            font-weight: 300;
        }

        /* หัวข้อต่างๆ ในการ์ด */
        .section-content {
            margin-top: 25px;
            text-align: left;
        }

        h2 {
            font-size: 18px;
            color: #4b5563;
            margin-bottom: 10px;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 5px;
        }

        p {
            color: #4b5563;
            line-height: 1.6;
            font-size: 15px;
            font-weight: 300;
        }

        /* ป้ายแสดงทักษะ (Tags) */
        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .skill-tag {
            background: #e0e7ff;
            color: #4338ca;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        /* ข้อมูลการติดต่อ */
        .contact-list {
            list-style: none;
            margin-top: 10px;
        }

        .contact-list li {
            margin-bottom: 8px;
            font-size: 15px;
            color: #4b5563;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .contact-list li a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .contact-list li a:hover {
            text-decoration: underline;
        }

        /* รองรับหน้าจอมือถือ */
        @media (max-width: 480px) {
            .profile-info {
                padding: 0 20px 30px;
            }
            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- พื้นหลังด้านบน -->
        <div class="header-bg"></div>

        <div class="profile-info">
            <!-- ใส่ URL รูปภาพของคุณตรง src -->
            <img src="https://i.postimg.cc/d1TWgCn3/Sprout-head-empty-pfp.jpg" alt="รูปโปรไฟล์" class="profile-pic">
            
            <h1>Natthawipha Siangwan</h1>
            <div class="title">Student</div>

            <!-- ส่วนแนะนำตัว -->
            <div class="section-content">
                <h2>เกี่ยวกับฉัน</h2>
                <p>None</p>
            </div>

            <!-- ส่วนทักษะความสามารถ -->
            <div class="section-content">
                <h2>ทักษะความสามารถ</h2>
                <div class="skills-list">
                    <span class="skill-tag">HTML & CSS</span>
                    <span class="skill-tag">JavaScript</span>
                    <span class="skill-tag">UI/UX Design</span>
                    <span class="skill-tag">Python</span>
                    <span class="skill-tag">การทำงานเป็นทีม</span>
                </div>
            </div>

            <!-- ส่วนการติดต่อ -->
            <div class="section-content">
                <h2>ช่องทางการติดต่อ</h2>
                <ul class="contact-list">
                    <li>📧 อีเมล: <a href="mailto:your.email@example.com">your.email@example.com</a></li>
                    <li>📱 เบอร์โทร: 08x-xxx-xxxx</li>
                    <li>🌐 เว็บไซต์: <a href="#" target="_blank">www.yourwebsite.com</a></li>
                </ul>
            </div>
        </div>
    </div>

</body>
</html>
